name: Linux release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and upload assets for
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: linux-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
      - uses: ./.github/actions/setup-build
      - name: Check packaging script
        run: deno check scripts/release.ts
      - name: Build and verify portable package
        run: opam exec -- deno run --allow-read --allow-write --allow-run scripts/release.ts "$RELEASE_TAG"
      - name: Verify source acceptance
        run: opam exec -- make verify
      - name: Verify packaged coverage and nested launcher
        run: ./_release/szaniec coverage --project-root test/fixtures/coverage-app --config szaniec/coverage.json
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          merge-multiple: true
          path: dist
      - name: Verify checksums and upload assets to the existing release
        run: |
          cd dist
          sha256sum --check *.sha256
          gh release view "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" ./*.tar.gz ./*.sha256 --clobber
