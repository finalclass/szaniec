name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    # Cold compiler fixtures plus packaging exceed one hour on hosted runners.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
      - name: Check packaging script
        run: deno check scripts/release.ts
      - name: Build portable Linux bundle through Well
        run: opam exec -- make build
      - name: Unit and integration suites
        run: opam exec -- make verify
      - name: Verify packaged coverage and nested launcher
        run: opam exec -- ./_release/szaniec coverage --project-root test/fixtures/coverage-app
